<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="How a weight is stored and decoded">
<title>How a weight is stored and decoded</title>
<rect x="0.5" y="0.5" width="759" height="291" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="24" y="36" font-size="17" font-weight="600" fill="#0b0b0b">How a weight is stored and decoded</text>
<text x="24" y="58" font-size="13" fill="#52514e">bit-exact: every BF16 pattern comes back; only the exponent is entropy-coded</text>
<text x="24" y="94" font-size="12" fill="#52514e">BF16 weight, 16 bits</text>
<rect x="24.0" y="104" width="10.5" height="26" rx="3" fill="#eb6834"/>
<text x="29.2" y="148" font-size="11.5" fill="#52514e" text-anchor="middle">s</text>
<rect x="36.5" y="104" width="98.0" height="26" rx="3" fill="#2a78d6"/>
<text x="85.5" y="148" font-size="11.5" fill="#52514e" text-anchor="middle">exponent · 8</text>
<rect x="136.5" y="104" width="85.5" height="26" rx="3" fill="#1baf7a"/>
<text x="179.2" y="148" font-size="11.5" fill="#52514e" text-anchor="middle">mantissa · 7</text>
<rect x="296" y="80" width="214" height="56" rx="8" fill="#fcfcfb" stroke="#1baf7a" stroke-width="2"/>
<text x="403.0" y="104.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">sign | mantissa byte</text>
<text x="403.0" y="122.0" font-size="11.5" fill="#52514e" text-anchor="middle">8 bit, stored raw</text>
<rect x="296" y="156" width="214" height="56" rx="8" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
<text x="403.0" y="180.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">exponent pairs → Huffman</text>
<text x="403.0" y="198.0" font-size="11.5" fill="#52514e" text-anchor="middle">≈ 2.7 bit/weight, per-lane streams</text>
<line x1="226" y1="112" x2="289" y2="108" stroke="#898781" stroke-width="1.5"/>
<path d="M296,108 l-8,-4 v8 Z" fill="#898781"/>
<line x1="226" y1="124" x2="289" y2="184" stroke="#898781" stroke-width="1.5"/>
<path d="M296,184 l-8,-4 v8 Z" fill="#898781"/>
<rect x="556" y="112" width="180" height="68" rx="8" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<text x="646.0" y="142.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">fused GEMV kernel</text>
<text x="646.0" y="160.0" font-size="11.5" fill="#52514e" text-anchor="middle">LUT → bf16×2 → FP32 FMA</text>
<line x1="510" y1="108" x2="549" y2="136" stroke="#898781" stroke-width="1.5"/>
<path d="M556,136 l-8,-4 v8 Z" fill="#898781"/>
<line x1="510" y1="184" x2="549" y2="158" stroke="#898781" stroke-width="1.5"/>
<path d="M556,158 l-8,-4 v8 Z" fill="#898781"/>
<text x="24" y="248" font-size="12" fill="#52514e">10.7 bit/weight on average (ratio 0.671). Decoded in registers, never materialised as BF16 during decode.</text>
<text x="24" y="268" font-size="12" fill="#52514e">Every tensor is decoded back on the GPU and compared bit-for-bit when the model loads.</text>
</svg>
